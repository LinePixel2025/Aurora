name: 报告 Bug
description: 报告一个可复现的缺陷（请勿用于安全漏洞）
title: '[Bug] '
labels: ['bug', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先搜索已有 Issue，并确认使用的是最新发布版。
        **安全漏洞请勿在此提交**，请按 [SECURITY.md](https://github.com/LinePixel2025/Aurora/blob/main/SECURITY.md) 走私密报告。

  - type: input
    id: version
    attributes:
      label: Aurora 版本
      description: 设置页 → 关于，或安装包文件名
      placeholder: 例如 0.6.4
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 24H2 (26100)
    validations:
      required: true

  - type: dropdown
    id: build
    attributes:
      label: 安装来源
      options:
        - GitHub Releases 安装包
        - 自建 Aurora Center 更新源
        - 本地源码运行（pnpm dev）
        - 其他（请在下方说明）
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 越具体越好；涉及快捷键、窗口、模式、插件时请写明
      placeholder: |
        1. 打开 …
        2. 点击 …
        3. 看到 …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 附截图 / 录屏（拖入即可）与完整的错误提示
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志片段（已脱敏）
      description: 位于 `%APPDATA%\Aurora\logs\`，按天轮转保留 7 天；请删除密钥、路径中的个人信息
      render: text
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 主界面 / 对话
        - 提示条 / 提示条小组件
        - 设置 / 配置
        - Agent 工具（文件 / 命令 / Office / 浏览器）
        - Computer Use
        - 插件系统 / 插件市场
        - 自动化 / 提醒
        - 记忆库 / 文件自感知
        - Aurora Center
        - 安装 / 更新
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue，确认不是重复问题
          required: true
        - label: 这不是安全漏洞（安全问题不走公开 Issue）
          required: true
