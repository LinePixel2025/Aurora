name: 功能建议
description: 提出新能力、改进现有体验或插件 / 集成方向的建议
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        请优先描述**场景与问题**，而不是直接给实现方案。范围与设计原则见 [docs/01](https://github.com/LinePixel2025/Aurora/blob/main/docs/01-overview.md)。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么工作流里遇到什么问题？现在的替代做法是什么？
      placeholder: |
        例如：每天要整理 3 个班级的作业文件，现在需要 …
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
      description: 描述你希望 Aurora 做什么，而不是具体怎么实现
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 已有的工具、Skill、插件、自动化能否解决？差在哪？
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      multiple: true
      options:
        - 主界面 / 对话
        - 提示条 / 提示条小组件
        - 设置 / 配置
        - Agent 工具（文件 / 命令 / Office / 浏览器）
        - Computer Use
        - 插件系统 / 插件市场
        - 自动化 / 提醒
        - 记忆库 / 文件自感知
        - Aurora Center
        - 安装 / 更新
        - 文档
        - 其他
    validations:
      required: true

  - type: dropdown
    id: breaking
    attributes:
      label: 是否可能影响兼容性
      description: 是否涉及配置 Schema、IPC 契约、插件清单或窗口行为
      options:
        - 不确定
        - 不影响
        - 可能涉及配置迁移
        - 可能涉及 IPC 契约
        - 可能涉及插件清单 / 权限
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue 与 docs/，确认不是已有能力或重复建议
          required: true
