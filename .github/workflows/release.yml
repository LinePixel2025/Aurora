name: Release

# 打 tag（v*）时自动打包 Windows 安装包并上传到**公开的 releases 仓库**。
# 源码仓库可以保持 private：客户端只从公开 releases 仓库读取更新清单，
# 不需要在安装包里携带任何 GitHub 凭证（docs/09 §1/§2）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '仅用于手动触发时的提示（版本以 package.json 为准）'
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish Windows installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # 不写 version：pnpm/action-setup 会读取 package.json 的
      # packageManager（pnpm@11.15.1）。两处都指定会报
      # ERR_PNPM_BAD_PM_VERSION 直接失败。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify (format / lint / typecheck / test / build)
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Package Windows installer
        # `--publish never`：产物由下一步的 gh 上传，避免 electron-builder
        # 用当前仓库的身份去发布（目标其实是另一个 releases 仓库）。
        run: pnpm --filter @aurora/desktop exec electron-builder --win --publish never

      - name: Verify release artifacts
        run: node scripts/verify-update.mjs

      - name: Publish to releases repository
        env:
          # 需要能写 LinePixel2025/Aurora-releases 的 token（repo 权限即可）
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $repo = "LinePixel2025/Aurora-releases"
          $assets = @(
            "apps/desktop/release/Aurora-Setup-$version.exe",
            "apps/desktop/release/Aurora-Setup-$version.exe.blockmap",
            "apps/desktop/release/latest.yml"
          )
          gh release view $tag --repo $repo 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --title "Aurora $tag" --notes "Aurora $tag（Windows x64 安装包，未签名）"
          }
          gh release upload $tag --repo $repo --clobber @assets
