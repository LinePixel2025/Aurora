name: Release

# 打 tag（v*）时自动打包 Windows 安装包并上传到**本仓库的 GitHub Releases**。
# 仓库已开源：客户端无需在安装包里携带任何 GitHub 凭证即可匿名读取更新清单
# （docs/09 §1/§2）。
# **按需触发**：不再跟随 `v*` tag 自动发布（docs/09 §2）。
#
# 原因：日常发布走本地 `scripts/release.mjs`（v0.3.0 起一直如此）；云端发布使用
# 仓库自带的 `GITHUB_TOKEN`（contents: write）即可，无需额外 `RELEASE_TOKEN`。
# 需要自动触发时把下面的 `push:` 块加回来：
#   on:
#     push:
#       tags: ['v*']
on:
  workflow_dispatch:
    inputs:
      version:
        description: '仅用于手动触发时的提示（版本以 package.json 为准）'
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish Windows installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # 不写 version：pnpm/action-setup 会读取 package.json 的
      # packageManager（pnpm@11.15.1）。两处都指定会报
      # ERR_PNPM_BAD_PM_VERSION 直接失败。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify (format / lint / typecheck / test / build)
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Package Windows installer
        # `--publish never`：产物由下一步的 gh 上传，目标仓库与 Release 正文
        # 都在下一步显式指定（不用 electron-builder 的默认发布文案）。
        run: pnpm --filter @aurora/desktop exec electron-builder --win --publish never

      - name: Verify release artifacts
        run: node scripts/verify-update.mjs

      - name: Publish to GitHub Releases
        env:
          # 同一仓库发布用自带 token 即可（workflow 已声明 contents: write）
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $repo = "LinePixel2025/Aurora"
          $assets = @(
            "apps/desktop/release/Aurora-Setup-$version.exe",
            "apps/desktop/release/Aurora-Setup-$version.exe.blockmap",
            "apps/desktop/release/latest.yml"
          )
          gh release view $tag --repo $repo 2>$null
          if ($LASTEXITCODE -ne 0) {
            # 发布说明与 tag 正文同源：强制使用 docs/release-notes 的完整正文
            gh release create $tag --repo $repo --title "Aurora $tag" --notes-file "docs/release-notes/$tag.md"
          }
          gh release upload $tag --repo $repo --clobber @assets

      - name: Publish to Aurora Center
        env:
          AURORA_CENTER_PASSWORD: ${{ secrets.AURORA_CENTER_PASSWORD }}
          AURORA_CENTER_URL: ${{ vars.AURORA_CENTER_URL || 'http://120.24.223.65:8787' }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AURORA_CENTER_PASSWORD)) {
            throw '缺少 secrets.AURORA_CENTER_PASSWORD，不能完成 GitHub + Center 双投发布'
          }
          node packages/center/bin/aurora-center.js releases publish `
            --server $env:AURORA_CENTER_URL `
            --user admin `
            --dir apps/desktop/release
