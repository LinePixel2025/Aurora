name: CI

# **按需触发**：不跟随 push / PR 自动运行（docs/09 §2）。
#
# 为什么：单人项目，PR 只用于高风险改动自审、不是强制门禁，而本地
# `pnpm test`（2930 项 / 204 个文件，约 30s）+ `pnpm build`（约 6s）已覆盖同一套检查。每次 push
# 自动跑只会产生与代码无关的红噪音（典型是 `pnpm install` 的供应链策略拦截，见
# pnpm-workspace.yaml 的 minimumReleaseAge 说明），拖慢开发节奏。
#
# 需要干净环境验证时手动发起：
#   Actions 页面 → Run workflow，或 `gh workflow run ci.yml`
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / typecheck / test / build
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # 不写 version：pnpm/action-setup 会读取 package.json 的
      # packageManager（pnpm@11.15.1）。两处都指定会报
      # ERR_PNPM_BAD_PM_VERSION 直接失败。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build (packages + Electron bundles)
        run: pnpm build
