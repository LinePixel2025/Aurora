<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>页面输入</title>
    <link rel="stylesheet" href="dialog-page.css" />
  </head>
  <body>
    <h3 id="greeting">你好</h3>
    <p class="hint">这是一个自定义 HTML / CSS 的临时窗口：内容完全由插件页面绘制。</p>
    <textarea id="text" placeholder="在这里输入…"></textarea>
    <div class="row">
      <span id="hint" class="error"></span>
      <button id="cancel" type="button">取消</button>
      <button id="save" type="button" class="primary">提交</button>
    </div>
    <script src="dialog-page.js"></script>
  </body>
</html>
