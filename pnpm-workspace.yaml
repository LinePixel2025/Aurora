packages:
  - apps/*
  - packages/*

# 供应链「最小发布年龄」策略：**显式钉为 0**（docs/09 §2）。
# pnpm 在 CI 环境会按 24 小时窗口校验 lockfile，把「刚发布不久」的依赖判为违规，
# `pnpm install --frozen-lockfile` 直接以 ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION 失败
# ——即使代码与 lockfile 都没问题，也要干等满 24 小时才自行恢复。
# 本机默认值是 0、CI 默认不是，两者不一致会让「本地全绿、CI 全红」。
# 钉死后 CI 与本地一致，避免发布时才暴露的假失败。
minimumReleaseAge: 0

# 允许执行安装脚本的依赖（pnpm 11 默认拦截所有 build script）：
# - electron: 下载 Electron 运行时二进制
# - esbuild: 下载平台原生二进制（vite / vitest 依赖）
# - vue-demi: 生成 Vue 2/3 兼容入口（pinia 依赖）
# 显式拒绝（写 false 而非删除条目）的依赖：
# - tesseract.js: 其 postinstall 只是 `opencollective-postinstall` 赞助请求，
#   不含任何功能步骤；拒绝可避免安装期联网，OCR 仍可正常使用。
# - electron-builder: 无任何 install/postinstall 脚本（平台二进制走 optionalDependencies），
#   放行 false 不影响打包。
# - electron-winstaller: 只为 Squirrel.Windows 准备 NuGet 包 / 下载 7z，
#   本项目用 NSIS（electron-builder 的 nsis target），不需要它。
allowBuilds:
  electron: true
  electron-builder: false
  electron-winstaller: false
  esbuild: true
  tesseract.js: false
  vue-demi: true

# 注 1：@napi-rs/canvas 通过 optionalDependencies 分发各平台预编译二进制，
#       自身没有安装脚本，因此无需出现在本文件中。
# 注 2：不再额外维护 `ignoredBuilds` 列表——pnpm 11 会把它与 `allowBuilds` 合并推导，
#       两处并存时 `ignoredBuilds` 条目不生效，且 `pnpm test` 前置的
#       verify-deps 检查会以 `ERR_PNPM_IGNORED_BUILDS` 让命令失败。
#       写成 `false` 已是显式决定，不需要第二份声明。
