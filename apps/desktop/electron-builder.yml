# electron-builder 打包配置（docs/04 §P6、docs/09 §3）
#
# 产物：Windows NSIS 安装包 + 自动更新所需的 latest.yml / blockmap。
# 更新源：**开源仓库自身的 Releases**（`LinePixel2025/Aurora`）——
# 仓库已公开，客户端无需携带任何 GitHub 凭证即可匿名检查更新。
#
# 不签名（用户选择）：首装会出现 SmartScreen「未知发行者」提示，
# 说明见 docs/09 §4；将来接入证书时只需加 `win.signingHashAlgorithms` +
# `CSC_LINK` / `CSC_KEY_PASSWORD` 环境变量，本文件结构无需改动。
appId: com.aurora.desktop
productName: Aurora
copyright: Copyright © 2026 LinePixel2025

directories:
  output: release
  buildResources: build

# 复用 pnpm 已经装好的 Electron 发行包（node_modules/electron/dist），
# 不让 electron-builder 再去 GitHub/@electron/get 下一份 —— 内网/代理环境下
# 那一步会因证书拦截直接失败，而且重复下载 150MB+ 纯属浪费。
# 版本一致性由 electron（devDependency）决定。
electronDist: node_modules/electron/dist

# `out/` 是 electron-vite 的产物（main / preload / renderer 全在里面）；
# `package.json` 必须显式包含，否则 electron-builder 找不到 main 入口。
files:
  - out/**/*
  - package.json
  - '!**/*.map'

# 内置 Skill 需要真实文件路径（skills/ 是 SKILL.md 包，不能进 asar）
extraResources:
  - from: ../../skills
    to: skills
    filter:
      - '**/*'
  - from: ../../packages/shared/src/browser/assets/fonts/HarmonyOS-Sans-LICENSE.txt
    to: licenses/HarmonyOS-Sans-LICENSE.txt
  # 托盘图标：主进程按 `process.resourcesPath/tray.png` 查找（src/main/index.ts 的
  # resolveTrayIcon）。`files` 只打 `out/**` + `package.json`，不显式带上的话
  # 打包后找不到该文件，托盘会静默退回内置的兜底圆点。
  - from: resources/tray.png
    to: tray.png
  # 窗口 / 任务栏图标（`resolveWindowIcon`）：16px 的 tray.png 在任务栏上会糊，用 256 那张。
  - from: resources/icon-256.png
    to: icon-256.png
  # Office 结构化工具引擎：固定版本、固定 SHA256，由 scripts/fetch-officecli.mjs 准备。
  - from: resources/officecli
    to: officecli
    filter:
      - '**/*'
  - from: resources/officecli/LICENSE
    to: licenses/OfficeCLI-LICENSE.txt

asar: true

# 原生模块（PTY 终端，2026-10-03）：@lydell/node-pty 的预编译 .node 二进制
# 不能进 asar（Electron 运行时要从真实文件路径加载），解包到 app.asar.unpacked
asarUnpack:
  - node_modules/@lydell/node-pty/**

win:
  icon: resources/icon.ico
  # 只跳过签名，**保留** exe 资源编辑（图标 / 版本信息照常写入）。
  # 别退回 `signAndEditExecutable: false` —— 它会把写 exe 图标这一步一起跳掉，
  # 打出来的 Aurora.exe 会停在 Electron 默认图标（2026-10-05 实测）。
  # 只关签名时资源编辑走 electron-builder 自带的 app-builder，不触发 winCodeSign 下载
  # （同日实测：本地缓存无 winCodeSign，--dir 打包仍成功），所以内网/离线照常出图。
  # 未签名安装包功能完全正常，只是首装会出现 SmartScreen「未知发行者」提示（docs/09 §4）。
  # 将来接入证书时：去掉这一行，并设置 CSC_LINK / CSC_KEY_PASSWORD 环境变量即可。
  signExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  # 产物名稳定且无空格，便于 CI 与手工上传
  artifactName: Aurora-Setup-${version}.${ext}

nsis:
  # 保留安装包：自动更新只下载增量 blockmap，不需要重新打包
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Aurora
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  # 卸载时保留用户配置与会话（%APPDATA%/Aurora），避免"卸载即丢数据"
  # 需要彻底清除时用户可手动删除该目录（docs/09 §5）

# 发布目标：上传安装包与更新元数据到开源仓库自身的 GitHub Releases。
# 本地打包（pnpm package）时 electron-builder 不会发布，只有带 --publish always
# 或 CI 上设置 CSC/ GH_TOKEN 才会真正上传（见 docs/09 §2）。
publish:
  provider: github
  owner: LinePixel2025
  repo: Aurora
  releaseType: release
  # 显式钉住更新通道：electron-builder 默认会从预发布版本号（`1.0.0-beta.1` → `beta`）
  # 推导出 `beta.yml`，而本仓库的发布脚本与客户端更新链路都按 `latest.yml` 组织。
  # 置为 latest 的语义是：**这次 beta 会推送给所有已装正式版的用户**（用户决策）。
  channel: latest
